{% extends "catalog/base.html" %}
{% block title %}Удалить статью — Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Удалить статью</h2>
  <p>Вы уверены, что хотите удалить <strong>«{{ object.title }}»</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
